# Blueprint Render : API + base PostgreSQL (render.com > New > Blueprint)
services:
  - type: web
    name: my-cvav-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: my-cvav-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RESPONSABLE_SIGNUP_CODE
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: WAVE_API_KEY
        sync: false
      - key: WAVE_WEBHOOK_SECRET
        sync: false
      - key: WAVE_MERCHANT_LINK
        sync: false

databases:
  - name: my-cvav-db
    plan: free
    databaseName: cvav
