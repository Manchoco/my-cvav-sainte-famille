name: Tests et APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      api_url:
        description: "URL de l'API intégrée dans l'APK (ex. https://my-cvav-api.onrender.com)"
        required: false

permissions:
  contents: write

jobs:
  backend:
    name: API — tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cvav_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/cvav_test

  apk:
    name: Application — APK Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Signature définitive : la clé est dans le dépôt, chiffrée (android/release-keystore.enc).
      # Seul le secret ANDROID_SIGNING_PASSWORD permet de la déchiffrer. Sans lui, signature de test.
      - name: Préparer la clé de signature
        env:
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          if [ -n "$SIGNING_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/release-keystore.enc \
              -out "$RUNNER_TEMP/release.jks" -pass env:SIGNING_PASSWORD
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "ANDROID_KEY_ALIAS=cvav"
            } >> "$GITHUB_ENV"
            echo "Signature : clé définitive My CVAV"
          else
            echo "::warning title=Signature de test::Ajoutez le secret ANDROID_SIGNING_PASSWORD pour signer avec la clé définitive (mises à jour possibles sans désinstaller)."
          fi

      - name: Compiler l'APK
        env:
          API_URL: ${{ github.event.inputs.api_url || vars.API_URL || 'https://my-cvav-sainte-famille-api-mamadoudibate-5976.vercel.app' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          set -o pipefail
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *//')
          APP_VERSION=${VERSION%%+*}
          APP_BUILD=${VERSION##*+}
          if ! flutter build apk --release --dart-define=API_URL="$API_URL" \
               --dart-define=APP_VERSION="$APP_VERSION" --dart-define=APP_BUILD="$APP_BUILD" 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            # Remonte les lignes d'erreur dans le résumé et les annotations de la compilation.
            grep -nE "What went wrong|rror|FAILURE|Exception|^e: |> " "$RUNNER_TEMP/build.log" | head -n 60 > "$RUNNER_TEMP/errors.txt" || true
            { echo '### Erreurs de compilation'; echo '```'; cat "$RUNNER_TEMP/errors.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Compilation APK::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$RUNNER_TEMP/errors.txt")"
            exit 1
          fi
          cp build/app/outputs/flutter-apk/app-release.apk build/my-cvav-sainte-famille.apk

      - uses: actions/upload-artifact@v4
        with:
          name: my-cvav-sainte-famille-apk
          path: app/build/my-cvav-sainte-famille.apk

      # Version publiée dans « Releases » : v + numéro de pubspec.yaml (ex. v1.0.0).
      # Chaque envoi sur main met à jour l'APK de cette version ; changer « version: » dans pubspec.yaml en crée une nouvelle.
      - name: Lire le numéro de version
        id: version
        run: |
          echo "tag=v$(grep '^version:' pubspec.yaml | sed -E 's/version: *//; s/\+.*//')" >> "$GITHUB_OUTPUT"

      - name: Publier la version
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: My CVAV Sainte Famille ${{ steps.version.outputs.tag }}
          make_latest: true
          overwrite_files: true
          body: |
            Application Android **My CVAV Sainte Famille**.
            Téléchargez `my-cvav-sainte-famille.apk` ci-dessous, ouvrez-le sur le téléphone et autorisez l'installation.
          files: app/build/my-cvav-sainte-famille.apk
