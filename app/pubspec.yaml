name: my_cvav
description: "My CVAV Sainte Famille — présences, cotisations et informations des Cœurs Vaillants – Âmes Vaillantes."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  provider: ^6.1.5
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  file_picker: ^13.2.0
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
